name: Build and Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install build-essential
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Build
      run: make all

    - name: Test
      run: make test
