<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150">
  <defs>
    <style>
      .node { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; rx: 20; ry: 20; }
      .text { font-family: ui-monospace, monospace; font-size: 14px; fill: #f1f5f9; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; }
      .arrow { fill: #64748b; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- Flow Nodes -->
  <rect x="50" y="50" width="100" height="40" class="node" />
  <text x="100" y="75" class="text">reserve</text>

  <line x1="150" y1="70" x2="200" y2="70" class="line" marker-end="url(#arr)" />

  <rect x="200" y="50" width="100" height="40" class="node" />
  <text x="250" y="75" class="text">bind</text>

  <line x1="300" y1="70" x2="350" y2="70" class="line" marker-end="url(#arr)" />

  <rect x="350" y="50" width="100" height="40" class="node" />
  <text x="400" y="75" class="text">write</text>

  <line x1="450" y1="70" x2="500" y2="70" class="line" marker-end="url(#arr)" />

  <rect x="500" y="50" width="100" height="40" class="node" />
  <text x="550" y="75" class="text">readback</text>

  <line x1="600" y1="70" x2="650" y2="70" class="line" marker-end="url(#arr)" />

  <rect x="650" y="50" width="100" height="40" class="node" />
  <text x="700" y="75" class="text">verify</text>

</svg>
