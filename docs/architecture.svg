<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 1.5; rx: 4; ry: 4; }
      .text { font-family: monospace; font-size: 14px; text-anchor: middle; }
      .line { stroke: #000; stroke-width: 1.5; fill: none; }
      .arrow { fill: #000; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- Layers -->
  <rect x="150" y="20" width="200" height="40" class="box" />
  <text x="250" y="45" class="text">Application / Runtime</text>

  <line x1="250" y1="60" x2="250" y2="100" class="line" marker-end="url(#arr)" />

  <rect x="150" y="100" width="200" height="40" class="box" />
  <text x="250" y="125" class="text">mem_hint API</text>

  <line x1="250" y1="140" x2="250" y2="180" class="line" marker-end="url(#arr)" />

  <rect x="150" y="180" width="200" height="40" class="box" />
  <text x="250" y="205" class="text">Residency Binding</text>

  <line x1="250" y1="220" x2="250" y2="260" class="line" marker-end="url(#arr)" />

  <rect x="150" y="260" width="200" height="40" class="box" />
  <text x="250" y="285" class="text">Backend Layer</text>

  <!-- Branches -->
  <path d="M 250 300 L 250 320 L 100 320 L 100 340" class="line" marker-end="url(#arr)" />
  <path d="M 250 300 L 250 320 L 400 320 L 400 340" class="line" marker-end="url(#arr)" />

  <text x="100" y="360" class="text">Mock SRAM</text>
  <text x="100" y="380" class="text">(Portable)</text>

  <text x="400" y="360" class="text">/dev/mem MMIO</text>
  <text x="400" y="380" class="text">(Hardware)</text>

</svg>
