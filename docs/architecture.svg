<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <style>
      .box { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; rx: 8; ry: 8; }
      .text { font-family: ui-monospace, monospace; font-size: 14px; fill: #f1f5f9; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; }
      .arrow { fill: #64748b; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- Layers -->
  <rect x="200" y="20" width="200" height="40" class="box" />
  <text x="300" y="45" class="text">Application / Runtime</text>

  <line x1="300" y1="60" x2="300" y2="100" class="line" marker-end="url(#arr)" />

  <rect x="200" y="100" width="200" height="40" class="box" />
  <text x="300" y="125" class="text">mem_hint API</text>

  <line x1="300" y1="140" x2="300" y2="180" class="line" marker-end="url(#arr)" />

  <rect x="200" y="180" width="200" height="40" class="box" />
  <text x="300" y="205" class="text">Residency Binding</text>

  <line x1="300" y1="220" x2="300" y2="260" class="line" marker-end="url(#arr)" />

  <rect x="200" y="260" width="200" height="40" class="box" />
  <text x="300" y="285" class="text">Backend Layer</text>

  <!-- Branches -->
  <path d="M 300 300 L 300 320 L 150 320 L 150 340" class="line" marker-end="url(#arr)" />
  <path d="M 300 300 L 300 320 L 450 320 L 450 340" class="line" marker-end="url(#arr)" />

  <text x="150" y="360" class="text">Mock SRAM</text>
  <text x="150" y="380" class="text" style="fill: #94a3b8; font-size: 12px;">(Portable)</text>

  <text x="450" y="360" class="text">/dev/mem MMIO</text>
  <text x="450" y="380" class="text" style="fill: #94a3b8; font-size: 12px;">(Hardware)</text>

</svg>
