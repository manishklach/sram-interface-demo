<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .bg { fill: #0a0f1e; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; ry: 8; }
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 16px; fill: #f1f5f9; text-anchor: middle; font-weight: 500; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .arrow { fill: #475569; }
      .title { font-family: sans-serif; font-size: 20px; fill: #f1f5f9; text-anchor: middle; font-weight: 700; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Title -->
  <text x="400" y="40" class="title">Memory Control Plane (SRAM Residency Prototype)</text>

  <!-- Layer 1 -->
  <rect x="275" y="80" width="250" height="60" class="box" />
  <text x="400" y="115" class="text">Application / AI Runtime</text>

  <line x1="400" y1="140" x2="400" y2="180" class="line" marker-end="url(#arr)" />

  <!-- Layer 2 -->
  <rect x="275" y="180" width="250" height="60" class="box" />
  <text x="400" y="215" class="text">mem_hint API</text>

  <line x1="400" y1="240" x2="400" y2="280" class="line" marker-end="url(#arr)" />

  <!-- Layer 3 -->
  <rect x="275" y="280" width="250" height="60" class="box" />
  <text x="400" y="315" class="text">Residency Binding</text>

  <!-- Branches -->
  <path d="M 400 340 L 400 360 L 200 360 L 200 380" class="line" marker-end="url(#arr)" />
  <path d="M 400 340 L 400 360 L 600 360 L 600 380" class="line" marker-end="url(#arr)" />

  <!-- Backends -->
  <rect x="75" y="380" width="250" height="60" class="box" />
  <text x="200" y="415" class="text">Mock SRAM</text>

  <rect x="475" y="380" width="250" height="60" class="box" />
  <text x="600" y="415" class="text">/dev/mem MMIO</text>

  <line x1="200" y1="440" x2="200" y2="460" class="line" marker-end="url(#arr)" />
  <line x1="600" y1="440" x2="600" y2="460" class="line" marker-end="url(#arr)" />

  <!-- Terminal Layers -->
  <rect x="75" y="460" width="250" height="40" class="box" style="opacity: 0.6;" />
  <text x="200" y="485" class="text" style="font-size: 14px; opacity: 0.8;">Portable Demo</text>

  <rect x="475" y="460" width="250" height="40" class="box" style="opacity: 0.6;" />
  <text x="600" y="485" class="text" style="font-size: 14px; opacity: 0.8;">Hardware SRAM</text>

</svg>
