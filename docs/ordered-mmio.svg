<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <style>
      .bg { fill: #0a0f1e; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; ry: 8; }
      .box-accent { stroke: #3b82f6; stroke-width: 2; }
      .text-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 16px; fill: #f1f5f9; text-anchor: middle; font-weight: 600; }
      .text-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .arrow { fill: #475569; }
      .header { font-family: sans-serif; font-size: 22px; fill: #f1f5f9; text-anchor: middle; font-weight: 700; }
      .footer { font-family: sans-serif; font-size: 14px; fill: #94a3b8; text-anchor: middle; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="400" y="50" class="header">Ordered MMIO Access for SRAM Apertures</text>

  <!-- Node 1: barrier -->
  <rect x="50" y="100" width="160" height="80" class="box box-accent" />
  <text x="130" y="135" class="text-title">barrier</text>
  <text x="130" y="160" class="text-sub">mfence / dmb sy</text>

  <line x1="210" y1="140" x2="270" y2="140" class="line" marker-end="url(#arr)" />

  <!-- Node 2: store/load -->
  <rect x="270" y="100" width="160" height="80" class="box" />
  <text x="350" y="135" class="text-title">store / load</text>
  <text x="350" y="160" class="text-sub">device-visible access</text>

  <line x1="430" y1="140" x2="490" y2="140" class="line" marker-end="url(#arr)" />

  <!-- Node 3: barrier -->
  <rect x="490" y="100" width="160" height="80" class="box box-accent" />
  <text x="570" y="135" class="text-title">barrier</text>
  <text x="570" y="160" class="text-sub">ordering guarantee</text>

  <line x1="650" y1="140" x2="710" y2="140" class="line" marker-end="url(#arr)" />

  <!-- Node 4: SRAM -->
  <rect x="710" y="90" width="120" height="100" class="box" />
  <text x="770" y="135" class="text-title">SRAM</text>
  <text x="770" y="160" class="text-sub">MMIO aperture</text>

  <!-- Footer -->
  <text x="400" y="250" class="footer">The important part is not only the memory access — it is enforcing order around device-visible memory.</text>

</svg>
